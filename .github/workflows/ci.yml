name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Worker dependencies
        run: npm ci --prefix backend/worker

      - name: Verify ONNX models
        run: pnpm run verify:onnx-models

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck Worker
        run: pnpm run backend:typecheck

      - name: Svelte check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Dead code audit
        run: pnpm run audit:deadcode

      - name: Colour tokens
        run: pnpm run check:colors

      # Skipped on PRs: the merge commit is frozen at run creation, so an
      # advisory published after a PR opened reddens it for reasons unrelated
      # to its diff. Branch pushes and the pre-push hook still gate on it, and
      # releases read this job's result; audit.yml catches drift on a schedule.
      - name: Dependency vulnerability audit
        if: github.event_name != 'pull_request'
        run: pnpm audit --prod --audit-level high

      - name: Test
        run: pnpm run test

      - name: Backend tests
        run: pnpm run backend:test

      - name: Build
        run: pnpm run build

      # Advisory smoke test for Linux path and platform regressions.
      - name: Linux boot smoke
        continue-on-error: true
        run: |
          pnpm exec playwright install-deps chromium
          xvfb-run -a pnpm run test:linux-boot

  # Commit subjects stay enforced in CI when local hooks are skipped.
  commit-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit subjects
        run: node scripts/check-commit-msg.mjs --ci
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # Native E2E stays on Windows; Linux runs the advisory boot smoke.

  validate-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck:main is in the ubuntu job and cannot differ by platform, so this
      # step repeats only what can: the ONNX asset check, the main-process tests
      # for the path and koffi behaviour ubuntu never exercises, and the build.
      - name: Verify Windows main process
        run: |
          pnpm run verify:onnx-models
          pnpm run test:main
          pnpm run build

      # Runs the real compiled dbwinWorker under a real Electron host against a
      # decoy Warframe.x64.exe. Guards the two v1.1.3 regressions (koffi.view
      # napi fatal under Electron's memory cage; BOOL-as-"bool" re-delivery
      # flood) that plain-node vitest can never catch. No GPU/game needed.
      - name: DBWIN worker regression (Electron host)
        run: pnpm run test:dbwin

      # Windows Server runners ship no OCR language pack, so the native reader
      # cannot start there. ONNX is bundled and covers the same screens.
      - name: Reward scan regression (Electron host)
        run: pnpm run test:reward-scan
        env:
          REWARD_SCAN_READERS: onnx

      # A retry that goes green still hides a broken test. Flaky fails the job.
      - name: E2E smoke tests (Windows)
        run: pnpm exec playwright test --config playwright.config.ts --fail-on-flaky-tests

      # Failure snapshots (error-context.md, traces) for post-mortems.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
