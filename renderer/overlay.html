<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none';"
    />
    <title data-i18n="settings.overlayTitle">Relic Overlay</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="overlay.css" />
    <link rel="stylesheet" href="overlay-layout.css" />
  </head>
  <body>
    <div id="panel">
      <div id="header">
        <span id="drag-hint" class="is-hidden"></span>
        <button id="btn-close" data-i18n-title="common.close" title="Close">&times;</button>
      </div>

      <div id="scanning-state" class="visible">
        <div class="scan-spinner"></div>
        <div id="scanning-text">Reading reward screen...</div>
      </div>

      <div id="planner-grid" class="is-hidden"></div>
      <div id="planner-hint" class="is-hidden"></div>

      <div id="slots-grid" class="is-hidden">
        <div class="reward-slot empty-slot" data-slot="0">
          <div class="slot-player">Slot 1</div>
          <div class="slot-name empty">-</div>
          <div class="slot-price-row">
            <span class="slot-rarity"></span>
            <span class="slot-price muted">-</span>
          </div>
          <div class="slot-meta"></div>
        </div>
        <div class="reward-slot empty-slot" data-slot="1">
          <div class="slot-player">Slot 2</div>
          <div class="slot-name empty">-</div>
          <div class="slot-price-row">
            <span class="slot-rarity"></span>
            <span class="slot-price muted">-</span>
          </div>
          <div class="slot-meta"></div>
        </div>
        <div class="reward-slot empty-slot" data-slot="2">
          <div class="slot-player">Slot 3</div>
          <div class="slot-name empty">-</div>
          <div class="slot-price-row">
            <span class="slot-rarity"></span>
            <span class="slot-price muted">-</span>
          </div>
          <div class="slot-meta"></div>
        </div>
        <div class="reward-slot empty-slot" data-slot="3">
          <div class="slot-player">Slot 4</div>
          <div class="slot-name empty">-</div>
          <div class="slot-price-row">
            <span class="slot-rarity"></span>
            <span class="slot-price muted">-</span>
          </div>
          <div class="slot-meta"></div>
        </div>
      </div>

      <div id="error-banner">OCR failed to detect reward items from the current screen.</div>

      <div id="best-footer" class="is-hidden">
        <span id="best-label" data-i18n="overlay.reward.bestLabel">Best:</span>
        <span id="best-value">Detecting...</span>
      </div>
    </div>
    <script src="reward-editor-bridge.js"></script>
    <script src="overlay-drag.js"></script>
    <script src="overlay-theme.js"></script>
    <script src="overlay-i18n.js"></script>
    <script src="reward-layout.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
