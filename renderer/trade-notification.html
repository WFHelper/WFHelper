<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://assets.wfhelper.com https://warframe.market; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none';"
    />
    <title data-i18n="overlay.window.trade">Trade Notification</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="trade-notification.css" />
    <link rel="stylesheet" href="overlay-layout.css" />
  </head>
  <body>
    <div id="notification" class="hidden">
      <div id="icon-area">
        <img id="item-thumb" alt="" />
      </div>
      <div id="info-area">
        <div id="top-line">
          <span id="trade-label">Trade Finished</span>
          <span id="trade-badge"></span>
        </div>
        <div id="item-line"><span id="item-quantity"></span><span id="item-name"></span></div>
        <div id="bottom-line">
          <span id="plat-amount"><span id="plat-value"></span><span id="plat-unit">p</span></span>
          <span id="partner-name"></span>
        </div>
        <div id="rep-line" hidden></div>
      </div>
    </div>
    <script src="reward-editor-bridge.js"></script>
    <script src="reward-layout.js"></script>
    <script src="overlay-theme.js"></script>
    <script src="overlay-i18n.js"></script>
    <script src="trade-notification.js"></script>
  </body>
</html>
